control:
  name: negative_control
  results_dir: "C:/results/negative_control"

experimentals:
  - name: experimental_01
    results_dir: "C:/results/experimental_01"
  - name: experimental_02
    results_dir: "C:/results/experimental_02"

output_dir: "C:/results/comparison"

# Each image contributes the same number of nuclei to the shared model.
max_training_nuclei_per_image: 25000
k_min: 2
k_max: 10
# Writes the joint diagnostic graph, then asks for one shared k.
# Use "automatic" for unattended execution or "fixed" with fixed_k.
cluster_selection_mode: "prompt"
fixed_k: null
silhouette_sample: 10000
minimum_cluster_fraction: 0.01
stability_repeats: 5
random_seed: 42
overlay_alpha: 0.55

# Creates one shared-phenotype, pyramidal OME-TIFF per sample. Set false if you
# only need the CSV results and lower-resolution spatial summaries.
render_joint_segmentation: true
