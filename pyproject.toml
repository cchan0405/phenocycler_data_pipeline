[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapi-grid"
version = "0.1.0"
description = "Whole-tissue DAPI nuclear-shape grid clustering for QPTIFF images"
requires-python = ">=3.10,<3.12"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "mxtifffile>=0.0.2",
  "numpy==1.23.5",
  "pandas>=2.1",
  "Pillow>=10",
  "protobuf>=3.20.3,<5",
  "PyYAML>=6",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "stardist>=0.9,<0.10",
  "streamlit>=1.35",
  "tensorflow>=2.12,<2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dapi-grid = "dapi_grid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
