input_qptiff: "C:/path/to/your/large_image.qptiff"
output_dir: "C:/path/to/dapi_grid_results"
channel: "DAPI"

# Pyramid level used to create the inexpensive whole-tissue mask.
detection_level: 5

# Level-0 chunk size and halo. The halo prevents nuclei being cut at chunk edges.
chunk_size_px: 4096
halo_px: 128

# Legacy non-overlapping grid size and physical calibration fallback.
grid_size_px: 512
# Optional physical grid size. Leave null until pixel size is known.
grid_size_um: null
pixel_size_um: null

tissue_mask:
  min_positive_fraction: 0.03
  gaussian_sigma: 1.0
  min_object_area: 200
  closing_radius: 2

stardist:
  model: "2D_versatile_fluo"
  prob_thresh: 0.50
  nms_thresh: 0.40
  n_tiles: [2, 2]

nucleus_qc:
  min_area_px: 80
  max_area_px: 3000
  min_solidity: 0.35
  max_dapi_normalized: 0.98

grid_qc:
  min_nuclei: 10
  min_tissue_fraction: 0.20

# Version 2: calculate features in a larger overlapping neighbourhood, but
# render the result onto smaller tiles. The legacy grid_qc values are used only
# when coverage/training sections are omitted.
spatial:
  analysis_window_px: 512
  display_stride_px: 256

# Any tile meeting these thresholds can receive a prediction.
coverage:
  min_nuclei_predict: 1
  min_tissue_fraction_predict: 0.005

# Only reliable windows meeting these thresholds fit scaling, PCA and K-means.
training:
  min_nuclei_train: 8
  min_tissue_fraction_train: 0.10

density_correction:
  residualize: true
  spline_knots: 4
  ridge_alpha: 1.0

confidence:
  low_confidence_threshold: 0.40
  minimum_display_confidence: 0.05
  confidence_weighted_alpha: true

phenotypes:
  enabled: true
  n_phenotypes: 5
  fit_sample: 200000
  minibatch_size: 4096
  random_seed: 42

clustering:
  k_min: 3
  k_max: 10
  fixed_k: null
  random_seed: 42
  silhouette_sample: 10000
  minibatch_size: 2048
  stability_repeats: 5
  stability_weight: 0.15
  complexity_weight: 0.015
  # Density remains available for residualisation but is not a model feature.
  density_mode: "exclude"
  density_weight: 0.0
  # Chunk-wise DAPI normalization makes intensity unsafe for global clustering.
  include_dapi_intensity: false

render:
  preview_level: 5
  alpha: 0.55
  draw_grid: false
